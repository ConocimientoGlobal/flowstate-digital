<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Fondo circular sutil -->
  <circle cx="200" cy="200" r="180" fill="#f0f4f8"/>
  
  <!-- Círculo decorativo externo -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1a3a6b" stroke-width="3" opacity="0.15"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.2"/>
  
  <!-- Letra F estilizada -->
  <g transform="translate(200, 200)">
    <!-- Horizontal superior -->
    <rect x="-70" y="-80" width="100" height="18" rx="4" fill="#1a3a6b"/>
    <!-- Horizontal medio -->
    <rect x="-70" y="-20" width="80" height="18" rx="4" fill="#1a3a6b"/>
    <!-- Vertical -->
    <rect x="-70" y="-80" width="18" height="160" rx="4" fill="#1a3a6b"/>
  </g>
  
  <!-- Onda fluida decorativa (Flow) -->
  <path d="M 100 280 Q 150 260 200 280 T 300 280" 
        fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 120 300 Q 170 280 220 300 T 280 300" 
        fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Puntos de datos (digital) -->
  <circle cx="130" cy="120" r="5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="270" cy="120" r="5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="200" cy="90" r="5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="150" cy="280" r="4" fill="#1a3a6b" opacity="0.3"/>
  <circle cx="250" cy="280" r="4" fill="#1a3a6b" opacity="0.3"/>
</svg>